apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ai-app
  template:
    metadata:
      labels:
        app: devops-ai-app
    spec:
      containers:
      - name: devops-ai-app
        image: devops-ai-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-key
              key: GEMINI_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: devops-ai-app-svc
spec:
  selector:
    app: devops-ai-app
  ports:
  - port: 5000
    targetPort: 5000
  type: NodePort
  